<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings MONIFY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <a class="logo" href="dashboard.html">MONIFY</a>
    <nav class="nav">
        <a href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a href="transactions.html"><i data-lucide="arrow-left-right"></i><span>Transactions</span></a>
        <a href="budgets.html"><i data-lucide="wallet"></i><span>Monthly Budget</span></a>
        <a href="reports.html"><i data-lucide="chart-column"></i><span>Reports</span></a>
        <a href="categories.html"><i data-lucide="tags"></i><span>Categories</span></a>
        <a href="settings.html?tab=appearance" class="active" id="navSettings"><i data-lucide="settings"></i><span>Settings</span></a>
        <a href="settings.html?tab=profile" id="navProfile"><i data-lucide="user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-user">
      <span class="avatar js-initials"></span>
      <div class="who"><strong class="js-name"></strong><small class="js-email"></small></div>
      <button class="icon-btn" id="logoutBtn" title="Logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="backdrop"></div>

  <div class="main">
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <div class="crumb"><span>MONIFY</span><i data-lucide="chevron-right"></i><strong id="crumbTitle">Settings</strong></div>
      <div class="topbar-right">
        <span class="top-date"><i data-lucide="calendar"></i><span id="todayDate"></span></span>
        <a class="icon-btn bell" id="bell" href="budgets.html"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></a>
        <a class="avatar js-initials" href="settings.html?tab=profile"></a>
      </div>
    </header>

    <!-- ===== ISI HALAMAN ===== -->
    <main class="content">
      <div id="fl"></div>

      <div class="page-head"><div><h1 id="pageTitle">Settings</h1><p class="muted">Kelola akun dan tampilan aplikasi.</p></div></div>

      <div class="tabs">
        <a href="?tab=profile" id="tabLink-profile">Profile</a>
        <a href="?tab=password" id="tabLink-password">Password</a>
        <a href="?tab=appearance" id="tabLink-appearance">Appearance</a>
      </div>

      <div class="card form-card">
        <!-- Tab: Profile -->
        <section id="tab-profile" hidden>
          <div class="profile-id">
            <span class="avatar lg js-initials"></span>
            <div><strong class="js-name"></strong><small class="muted block js-email"></small></div>
          </div>
          <form id="profileForm">
            <label class="field"><span>Nama lengkap</span><input type="text" name="name" required></label>
            <label class="field"><span>Email</span><input type="email" name="email" required></label>
            <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
          </form>
        </section>

        <!-- Tab: Password -->
        <section id="tab-password" hidden>
          <form id="pwForm">
            <label class="field"><span>Current Password</span><input type="password" name="current" required></label>
            <label class="field"><span>New Password</span><input type="password" name="new" minlength="8" required></label>
            <label class="field"><span>Confirm New Password</span><input type="password" name="confirm" required></label>
            <button class="btn btn-primary" type="submit">Ubah Password</button>
          </form>
        </section>

        <!-- Tab: Appearance -->
        <section id="tab-appearance" hidden>
          <form id="themeForm">
            <p class="muted">Pilih tema tampilan. Pilihan disimpan di browser ini.</p>
            <div class="theme-options">
              <label class="theme-opt"><input type="radio" name="theme" value="light"><span><i data-lucide="sun"></i>Light Mode</span></label>
              <label class="theme-opt"><input type="radio" name="theme" value="dark"><span><i data-lucide="moon"></i>Dark Mode</span></label>
            </div>
            <button class="btn btn-primary" type="submit">Simpan Tampilan</button>
            <button class="btn btn-ghost" type="button" id="resetDemoBtn" style="margin-left:8px">Reset data demo</button>
          </form>
        </section>
      </div>

    </main>
  </div>
</div>

<!-- Library eksternal -->
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<!-- Kode MONIFY (urutan penting: core → ui → halaman) -->
<script src="assets/js/core/helpers.js"></script>
<script src="assets/js/core/data.js"></script>
<script src="assets/js/core/queries.js"></script>
<script src="assets/js/ui/layout.js"></script>

<script src="assets/js/pages/settings.js"></script>
</body>
</html>
