<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly Budget MONIFY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <a class="logo" href="dashboard.html">MONIFY</a>
    <nav class="nav">
        <a href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a href="transactions.html"><i data-lucide="arrow-left-right"></i><span>Transactions</span></a>
        <a href="budgets.html" class="active"><i data-lucide="wallet"></i><span>Monthly Budget</span></a>
        <a href="reports.html"><i data-lucide="chart-column"></i><span>Reports</span></a>
        <a href="categories.html"><i data-lucide="tags"></i><span>Categories</span></a>
        <a href="settings.html?tab=appearance" id="navSettings"><i data-lucide="settings"></i><span>Settings</span></a>
        <a href="settings.html?tab=profile" id="navProfile"><i data-lucide="user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-user">
      <span class="avatar js-initials"></span>
      <div class="who"><strong class="js-name"></strong><small class="js-email"></small></div>
      <button class="icon-btn" id="logoutBtn" title="Logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="backdrop"></div>

  <div class="main">
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <div class="crumb"><span>MONIFY</span><i data-lucide="chevron-right"></i><strong id="crumbTitle">Monthly Budget</strong></div>
      <div class="topbar-right">
        <span class="top-date"><i data-lucide="calendar"></i><span id="todayDate"></span></span>
        <a class="icon-btn bell" id="bell" href="budgets.html"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></a>
        <a class="avatar js-initials" href="settings.html?tab=profile"></a>
      </div>
    </header>

    <!-- ===== ISI HALAMAN ===== -->
    <main class="content">
      <div id="fl"></div>

      <div class="page-head">
        <div><h1>Monthly Budget</h1><p class="muted">Batasi pengeluaran per kategori setiap bulan.</p></div>
        <button class="btn btn-primary" id="addBudBtn"><i data-lucide="plus"></i>Tambah Anggaran</button>
      </div>

      <form class="filters card" id="budFilter">
        <select name="month">
          <option value="1">Januari</option>
          <option value="2">Februari</option>
          <option value="3">Maret</option>
          <option value="4">April</option>
          <option value="5">Mei</option>
          <option value="6">Juni</option>
          <option value="7">Juli</option>
          <option value="8">Agustus</option>
          <option value="9">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
        <select name="year"></select>
        <button class="btn btn-ghost" type="submit">Tampilkan</button>
        <span class="muted filters-note">Total limit <strong id="totLimit"></strong> · terpakai <strong id="totSpent"></strong></span>
      </form>

      <div class="card empty" id="budEmpty" hidden><span id="budEmptyText"></span></div>
      <div class="budget-grid" id="budGrid"></div>

      <!-- Modal tambah / edit anggaran -->
      <div class="modal" id="budModal" hidden>
        <form class="modal-box modal-sm" id="budForm">
          <div class="modal-head">
            <h3 id="budTitle">Tambah Anggaran</h3>
            <button type="button" class="icon-btn" data-close aria-label="Tutup"><i data-lucide="x"></i></button>
          </div>
          <input type="hidden" id="budId">
          <p class="muted small">Periode: <strong id="budPeriod"></strong></p>
          <label class="field"><span>Kategori</span><select name="category_id" id="budCategory" required></select></label>
          <label class="field"><span>Limit anggaran (Rp)</span><input type="number" name="amount" id="budAmount" min="1" step="1" required></label>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" data-close>Batal</button>
            <button class="btn btn-primary" type="submit">Simpan</button>
          </div>
        </form>
      </div>

      <!-- Template kartu anggaran -->
      <template id="tplBudCard">
        <div class="card budget-card">
          <div class="budget-top"><strong class="js-name"></strong><span class="badge js-status"></span></div>
          <div class="budget-big"><span class="js-spent"></span> <small class="muted js-limit"></small></div>
          <div class="progress js-progress"><span class="js-bar"></span></div>
          <div class="budget-meta"><span class="js-pct"></span><span class="js-left"></span></div>
          <p class="note js-note" hidden><i data-lucide="triangle-alert"></i><span class="js-note-text"></span></p>
          <div class="card-actions">
            <button class="icon-btn js-edit" title="Edit"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger js-del" title="Hapus"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      </template>

    </main>
  </div>
</div>

<!-- Library eksternal -->
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<!-- Kode MONIFY (urutan penting: core → ui → halaman) -->
<script src="assets/js/core/helpers.js"></script>
<script src="assets/js/core/data.js"></script>
<script src="assets/js/core/queries.js"></script>
<script src="assets/js/ui/layout.js"></script>

<script src="assets/js/pages/budgets.js"></script>
</body>
</html>
